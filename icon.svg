<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1430"/>
      <stop offset="55%" stop-color="#0A0E1F"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#6EE7FF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6EE7FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 星点 -->
  <g fill="#E8ECFF">
    <circle cx="96" cy="104" r="3.4" opacity=".85"/>
    <circle cx="418" cy="140" r="2.6" opacity=".7"/>
    <circle cx="140" cy="404" r="2.8" opacity=".6"/>
    <circle cx="396" cy="392" r="3.2" opacity=".75"/>
    <circle cx="258" cy="74" r="2.2" opacity=".55"/>
    <circle cx="70" cy="268" r="2.4" opacity=".5"/>
    <circle cx="444" cy="262" r="2.4" opacity=".5"/>
  </g>

  <!-- 大陆球 -->
  <circle cx="256" cy="248" r="118" fill="url(#globe)" opacity=".22"/>
  <circle cx="256" cy="248" r="118" fill="none" stroke="url(#globe)" stroke-width="9" opacity=".95"/>

  <!-- 经纬线 -->
  <g stroke="#6EE7FF" stroke-width="5" fill="none" opacity=".55">
    <ellipse cx="256" cy="248" rx="118" ry="44"/>
    <ellipse cx="256" cy="248" rx="44" ry="118"/>
    <line x1="138" y1="248" x2="374" y2="248"/>
  </g>

  <!-- 关卡节点链路 -->
  <g>
    <circle cx="196" cy="192" r="17" fill="#6EE7FF"/>
    <circle cx="256" cy="248" r="17" fill="#FFD166"/>
    <circle cx="322" cy="308" r="17" fill="#A78BFA" opacity=".55"/>
    <path d="M208 204 L244 236" stroke="#6EE7FF" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <path d="M268 260 L310 296" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10" opacity=".6"/>
  </g>
</svg>
